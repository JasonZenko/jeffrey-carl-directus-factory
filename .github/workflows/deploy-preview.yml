name: deploy-preview

# Credentialed noindex Cloudflare Pages preview deploy.
# Secrets are referenced here but never committed:
#   CLOUDFLARE_API_TOKEN  - Pages:Edit token for the review account
#   CLOUDFLARE_ACCOUNT_ID - target account id
# Directus-connected builds additionally need:
#   DIRECTUS_SERVER_TOKEN - server-only static token for published content

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: noindex-preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install auditor dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Extract frozen content
        run: python3 scripts/extract.py

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build review site
        working-directory: site
        run: npm run build
        env:
          DIRECTUS_URL: https://weomcms.foundryworks.ai
          DIRECTUS_SERVER_TOKEN: ${{ secrets.DIRECTUS_SERVER_TOKEN }}

      - name: Run tests
        working-directory: site
        run: npm test

      - name: Verify live Directus authoring contract
        run: node scripts/verify_directus_authoring.mjs
        env:
          DIRECTUS_URL: https://weomcms.foundryworks.ai
          DIRECTUS_BUILD_TOKEN: ${{ secrets.DIRECTUS_SERVER_TOKEN }}

      - name: Audit before deploy (strict)
        run: |
          PORT=4321 node scripts/serve.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/robots.txt > /dev/null && break; sleep 1; done
          python3 auditor/audit_rendered.py --target http://127.0.0.1:4321 --strict
          python3 qa/browser_matrix.py --target http://127.0.0.1:4321
          python3 qa/visual_fidelity.py --target http://127.0.0.1:4321

      - name: Deploy noindex preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=jeffrey-carl-review
