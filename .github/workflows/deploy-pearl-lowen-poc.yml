name: deploy-pearl-lowen-final-b

on:
  workflow_dispatch:
    inputs:
      provision_dom:
        description: Reset and verify Dom's isolated-CMS reviewer login
        required: false
        default: false
        type: boolean
  push:
    branches: [pearl/lowen-poc-final-b]

jobs:
  final-b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: noindex-preview
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install deterministic test dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          cd site
          npm ci

      - name: Prove exact approved Pearl ancestry
        run: python3 poc/lowen-final-b/verify-template-provenance.py

      - name: Rebuild and independently verify the frozen source map
        run: |
          python3 poc/lowen-baseline-a/scripts/object-map.py
          git diff --exit-code -- poc/lowen-baseline-a/migration
          node poc/lowen-baseline-a/scripts/validate-release.mjs
          node poc/lowen-baseline-b/validate-prepared.mjs
          python3 poc/lowen-final-b/source-region-gate.py
          python3 poc/lowen-tab8-validation/tab8_gate.py
          python3 poc/lowen-final-b/prepare-static-source-assets.py

      - name: Prove the isolated Beaverton normal-versus-utility comparison
        run: |
          python3 poc/beaverton-comparison/verify_freeze.py
          python3 poc/beaverton-comparison/build_comparison.py
          python3 poc/beaverton-comparison/validate_outputs.py
          python3 poc/lowen-tab8-validation/validate_director_comparison.py poc/beaverton-comparison/outputs/director-comparison.json
          git diff --exit-code -- poc/beaverton-comparison/outputs

      - name: Require a machine-proven rollback backup
        run: |
          jq -e '.ok and .pg_restore_list_verified and .uploads_archive_verified and .temporary_database_restore_verified and (.source_counts == .restored_counts)' poc/lowen-final-b/receipts/backup-restore-receipt.json

      - name: Apply the reviewed Pearl 1.2 contract and exact frozen object map
        timeout-minutes: 15
        run: |
          node poc/lowen-final-b/provision-feedback-schema.mjs --apply
          node poc/lowen-baseline-a/scripts/import-to-directus.mjs --apply
          node poc/lowen-final-b/purge-stale-components.mjs --apply
        env:
          DIRECTUS_URL: https://pearl-lowen-poc-cms.foundryworks.ai
          DIRECTUS_ADMIN_EMAIL: ${{ secrets.PEARL_LOWEN_ADMIN_EMAIL }}
          DIRECTUS_ADMIN_PASSWORD: ${{ secrets.PEARL_LOWEN_ADMIN_PASSWORD }}
          PEARL_PUBLIC_ASSET_FOLDER_ID: ${{ secrets.PEARL_LOWEN_PUBLIC_ASSET_FOLDER_ID }}
          PEARL_BASELINE: Final B
          PEARL_RECEIPTS_DIR: poc/lowen-final-b/receipts

      - name: Reset and identity-prove Dom's reviewer login when explicitly dispatched
        if: github.event_name == 'workflow_dispatch' && inputs.provision_dom
        run: node poc/lowen-final-b/provision-reviewer.mjs
        env:
          DIRECTUS_URL: https://pearl-lowen-poc-cms.foundryworks.ai
          DIRECTUS_ADMIN_EMAIL: ${{ secrets.PEARL_LOWEN_ADMIN_EMAIL }}
          DIRECTUS_ADMIN_PASSWORD: ${{ secrets.PEARL_LOWEN_ADMIN_PASSWORD }}
          DOM_ADMIN_EMAIL: ${{ secrets.PEARL_LOWEN_DOM_ADMIN_EMAIL }}
          DOM_ADMIN_PASSWORD: ${{ secrets.PEARL_LOWEN_DOM_ADMIN_PASSWORD }}

      - name: Prove dry-run and importer idempotence
        timeout-minutes: 15
        run: node poc/lowen-final-b/idempotence-gate.mjs
        env:
          DIRECTUS_URL: https://pearl-lowen-poc-cms.foundryworks.ai
          DIRECTUS_ADMIN_EMAIL: ${{ secrets.PEARL_LOWEN_ADMIN_EMAIL }}
          DIRECTUS_ADMIN_PASSWORD: ${{ secrets.PEARL_LOWEN_ADMIN_PASSWORD }}
          PEARL_PUBLIC_ASSET_FOLDER_ID: ${{ secrets.PEARL_LOWEN_PUBLIC_ASSET_FOLDER_ID }}

      - name: Prove Final B is the sole live Lowen authoring state
        run: |
          node poc/lowen-final-b/authoring-gate.mjs
          node poc/lowen-final-b/final-state-proof.mjs
        env:
          DIRECTUS_URL: https://pearl-lowen-poc-cms.foundryworks.ai
          PEARL_DIRECTUS_TOKEN: ${{ secrets.PEARL_LOWEN_DIRECTUS_TOKEN }}
          DIRECTUS_ADMIN_EMAIL: ${{ secrets.PEARL_LOWEN_ADMIN_EMAIL }}
          DIRECTUS_ADMIN_PASSWORD: ${{ secrets.PEARL_LOWEN_ADMIN_PASSWORD }}
          DOM_ADMIN_EMAIL: ${{ secrets.PEARL_LOWEN_DOM_ADMIN_EMAIL }}
          DOM_ADMIN_PASSWORD: ${{ secrets.PEARL_LOWEN_DOM_ADMIN_PASSWORD }}

      - name: Build the credentialed connected site
        working-directory: site
        run: npm run build
        env:
          PEARL_CONTENT_MODE: connected
          PEARL_DIRECTUS_URL: https://pearl-lowen-poc-cms.foundryworks.ai
          PEARL_DIRECTUS_TOKEN: ${{ secrets.PEARL_LOWEN_DIRECTUS_TOKEN }}

      - name: Verify the connected CMS object map
        run: node poc/lowen-baseline-a/scripts/verify-connected-build.mjs
        env:
          PEARL_DIRECTUS_URL: https://pearl-lowen-poc-cms.foundryworks.ai
          PEARL_DIRECTUS_TOKEN: ${{ secrets.PEARL_LOWEN_DIRECTUS_TOKEN }}
          PEARL_BASELINE: Final B
          PEARL_RECEIPTS_DIR: poc/lowen-final-b/receipts

      - name: Run all shared contracts before replacing the review root
        working-directory: site
        run: npm test
        env:
          PEARL_DIRECTUS_URL: https://pearl-lowen-poc-cms.foundryworks.ai
          PEARL_DIRECTUS_TOKEN: ${{ secrets.PEARL_LOWEN_DIRECTUS_TOKEN }}

      - name: Deploy approved connected Lowen build after contract smoke checks
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=pearl-lowen-poc --branch=pearl-lowen-poc

      - name: Preserve accepted Jeffrey regression evidence
        run: |
          PORT=4321 node scripts/serve.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4321/robots.txt >/dev/null && break; sleep 1; done
          python3 auditor/audit_rendered.py --target http://127.0.0.1:4321 --strict
          if ! python3 qa/browser_matrix.py --target http://127.0.0.1:4321; then
            cp qa/browser-matrix-results.json qa/browser-matrix-first-attempt.json
            python3 qa/browser_matrix.py --target http://127.0.0.1:4321
          fi
          python3 qa/visual_fidelity.py --target http://127.0.0.1:4321

      - name: Prove every used parent and nested field is authoritative
        run: node poc/lowen-final-b/field-authority-gate.mjs
        env:
          DIRECTUS_URL: https://pearl-lowen-poc-cms.foundryworks.ai
          PEARL_DIRECTUS_TOKEN: ${{ secrets.PEARL_LOWEN_DIRECTUS_TOKEN }}
          DIRECTUS_ADMIN_EMAIL: ${{ secrets.PEARL_LOWEN_ADMIN_EMAIL }}
          DIRECTUS_ADMIN_PASSWORD: ${{ secrets.PEARL_LOWEN_ADMIN_PASSWORD }}

      - name: Reverify the restored connected build
        run: node poc/lowen-baseline-a/scripts/verify-connected-build.mjs
        env:
          PEARL_DIRECTUS_URL: https://pearl-lowen-poc-cms.foundryworks.ai
          PEARL_DIRECTUS_TOKEN: ${{ secrets.PEARL_LOWEN_DIRECTUS_TOKEN }}
          PEARL_BASELINE: Final B
          PEARL_RECEIPTS_DIR: poc/lowen-final-b/receipts

      - name: Run all 234 clean/template browser cases locally
        run: |
          PORT=4322 node scripts/serve.mjs &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4322/robots.txt >/dev/null && break; sleep 1; done
          python3 poc/lowen-final-b/route-matrix-qa.py --target http://127.0.0.1:4322
          cp poc/lowen-final-b/receipts/route-matrix-qa.json poc/lowen-final-b/receipts/route-matrix-local.json

      - name: Capture every frozen-source versus Final B viewport pair
        run: python3 poc/lowen-final-b/source-preview-visual-qa.py --target http://127.0.0.1:4322

      - name: Assert isolated noindex review root
        run: |
          grep -q 'data-page-slug="home"' site/dist/index.html
          grep -q 'noindex, nofollow' site/dist/index.html
          test "$(find site/dist/lowen-assets -type f | wc -l | tr -d ' ')" = "3"

      - name: Rerun the complete browser gate against the live deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOYMENT_JSON="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/pearl-lowen-poc/deployments?per_page=10")"
          DEPLOYMENT_ID="$(printf %s "$DEPLOYMENT_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["success"]; expected=sys.argv[1]; item=next(x for x in d["result"] if expected.startswith(x["deployment_trigger"]["metadata"]["commit_hash"])); print(item["id"])' "$GITHUB_SHA")"
          DEPLOYMENT_SOURCE="$(printf %s "$DEPLOYMENT_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); expected=sys.argv[1]; item=next(x for x in d["result"] if expected.startswith(x["deployment_trigger"]["metadata"]["commit_hash"])); print(item["deployment_trigger"]["metadata"]["commit_hash"])' "$GITHUB_SHA")"
          DEPLOYMENT_URL="$(printf %s "$DEPLOYMENT_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); expected=sys.argv[1]; item=next(x for x in d["result"] if expected.startswith(x["deployment_trigger"]["metadata"]["commit_hash"])); print(item["url"])' "$GITHUB_SHA")"
          for i in $(seq 1 60); do curl -sf "$DEPLOYMENT_URL/" >/dev/null && break; sleep 2; done
          python3 poc/lowen-final-b/route-matrix-qa.py --target "$DEPLOYMENT_URL"
          mv poc/lowen-final-b/receipts/route-matrix-qa.json poc/lowen-final-b/receipts/route-matrix-live.json
          IMMUTABLE_ROOT_SHA="$(curl -fsS "$DEPLOYMENT_URL/" | sha256sum | cut -d' ' -f1)"
          for i in $(seq 1 60); do
            ALIAS_ROOT_SHA="$(curl -fsS https://pearl-lowen-poc.pages.dev/ | sha256sum | cut -d' ' -f1)"
            [ "$ALIAS_ROOT_SHA" = "$IMMUTABLE_ROOT_SHA" ] && break
            sleep 2
          done
          test "$ALIAS_ROOT_SHA" = "$IMMUTABLE_ROOT_SHA"
          python3 poc/lowen-final-b/live-deployment-gate.py \
            --target https://pearl-lowen-poc.pages.dev \
            --deployment-id "$DEPLOYMENT_ID" \
            --deployment-url "$DEPLOYMENT_URL" \
            --source "$DEPLOYMENT_SOURCE" \
            --expected-source "$GITHUB_SHA"

      - name: Upload the complete Final B evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowen-final-b-evidence-${{ github.sha }}
          path: |
            poc/lowen-final-b/receipts
            poc/lowen-final-b/visual
            auditor/fidelity-results.json
            qa/browser-matrix-results.json
            qa/browser-matrix-first-attempt.json
            qa/visual-fidelity-results.json
            qa/visual/current
          if-no-files-found: error
          retention-days: 30
